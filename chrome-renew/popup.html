<!doctype html><html lang="en"><head><meta charset="utf-8"><style>
body{font:14px system-ui;width:310px;padding:12px;background:#20242c;color:#eef2f8}h2{font-size:17px;margin-top:0}input,button{box-sizing:border-box;width:100%;padding:9px;margin-top:8px;border-radius:5px}button{cursor:pointer}p{line-height:1.5}#status{color:#a9d5ff}</style></head><body>
<h2>TakeProfit renewal</h2><p>For your own account and authorized local use only. When your paired process requests renewal, Chrome will request a fresh token from TakeProfit and deliver it only to that process on your computer. Keep Chrome signed in.</p>
<input id="code" type="password" autocomplete="off" placeholder="Local pairing code"><button id="enable">Authorize and pair</button><button id="disable">Disable renewal</button><p id="status" role="status"></p><script src="popup.js"></script></body></html>

name: Offline regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q tpscraper tests
      - run: python -m unittest discover -s tests -v
  portable-install:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: "portable test folder"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fresh environment from a path containing spaces
        run: python "portable test folder/launch.py" --check
      - name: Reuse environment without reinstalling dependencies
        run: python "portable test folder/launch.py" --check

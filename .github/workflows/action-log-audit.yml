name: Historical Actions log audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/action-log-audit.yml, scripts/audit_action_logs.py]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Inspect historical log archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/audit_action_logs.py --repo "${{ github.repository }}"
